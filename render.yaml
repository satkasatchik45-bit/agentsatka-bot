services:
  - type: web
    name: agentsatka-bot
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py --bot
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_TELEGRAM_USERS
        sync: false
      - key: MODEL_NAME
        value: gemini-3.6-flash
